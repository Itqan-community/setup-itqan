name: Move the major tag

# Publishing release v1.2.3 points the v1 tag at it, so `uses: itqan-community/setup-itqan@v1`
# gets the latest v1.x.y. See RELEASING in README.md.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  tag:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Move the tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::$TAG is not vX.Y.Z"; exit 1; }
          major="${TAG%%.*}"
          git tag -f "$major" "$GITHUB_SHA"
          git push -f origin "refs/tags/$major"
