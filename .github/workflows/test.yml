name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"  # weekly, to catch a new itqan release breaking the action

permissions:
  contents: read

jobs:
  setup:
    name: ${{ matrix.runner }} (${{ matrix.version }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest]
        version: [latest, 0.1.3]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - id: itqan
        uses: ./
        with:
          version: ${{ matrix.version }}
          registry-url: https://api.cms.itqan.dev

      - name: Check the outputs and PATH
        env:
          VERSION: ${{ steps.itqan.outputs.version }}
          BINARY: ${{ steps.itqan.outputs.path }}
          CACHE_HIT: ${{ steps.itqan.outputs.cache-hit }}
        run: |
          set -x
          if [ "${{ matrix.version }}" != latest ]; then test "$VERSION" = "${{ matrix.version }}"; fi
          test "$(itqan --version)" = "itqan, version $VERSION"
          test "$("$BINARY" --version)" = "itqan, version $VERSION"
          test "$ITQAN_REGISTRY_URL" = https://api.cms.itqan.dev
          echo "cache-hit: $CACHE_HIT"

      - name: Create a manifest
        run: mkdir project && cd project && itqan init

      - name: Install with the action
        uses: ./
        with:
          version: ${{ matrix.version }}
          install: true
          working-directory: project

      - name: Check the assets were installed
        run: test -f project/itqan-assets.lock && find project -maxdepth 2

  bad-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: itqan
        uses: ./
        continue-on-error: true
        with:
          version: 0.0.0
      - name: Check it failed
        run: test "${{ steps.itqan.outcome }}" = failure
